<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anthony Sandoval - Terra Firma Global - Regenerative Real Estate & Impact Investing">
    <meta name="keywords" content="regenerative real estate, impact investing, family office advisory, sustainable development">
    <title>Terra Firma Global | Regenerative Capital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <!-- SEO Meta Tags -->
    <meta name="description" content="Terra Firma Global connects visionary capital with regenerative real estate, sustainable hospitality, mass timber, and climate-aligned projects worldwide.">
    <meta name="keywords" content="regenerative real estate, impact investing, sustainable development, CLT, family office, green real estate, Terra Firma Global">
    
    <!-- Open Graph / Social Sharing (for rich previews) -->
    <meta property="og:title" content="Terra Firma Global | Regenerative Capital">
    <meta property="og:description" content="Strategic capital for regenerative real estate, sustainable hospitality, and transformative impact projects.">
    <meta property="og:image" content="https://terrafirmaglobal.com/assets/logo.png">
    <meta property="og:url" content="https://terrafirmaglobal.com">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Terra Firma Global | Regenerative Capital">
    <meta name="twitter:description" content="Connecting capital with regenerative real estate and impact projects.">
    <meta name="twitter:image" content="https://terrafirmaglobal.com/assets/logo.png">
    
    <!-- Favicon -->
    <link rel="icon" href="assets/Terra%20Firma%20Favicon%20icon.ico" type="image/x-icon">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #1a1a1a;
            background: #ffffff;
            line-height: 1.6;
        }

        :root {
            --primary-green: #1b4332;
            --secondary-green: #2d6a4f;
            --light-green: #40916c;
            --warm-gold: #d4af37;
            --cream: #f5f1e8;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0; width: 100%;
            background: rgba(255,255,255,0.98);
            z-index: 1000;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(27,67,50,0.1);
            backdrop-filter: blur(10px);
        }

        .logo-img {
            height: 72px;
            width: auto;
            transition: all 0.3s ease;
        }

        .logo-img:hover { transform: scale(1.05); }

        nav ul {
            display: flex;
            list-style: none;
            gap: 50px;
        }

        nav a {
            color: #333;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover { color: var(--primary-green); }

        /* Hero */
        .hero {
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 0px;
        }

        .hero-video {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .hero-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(15,40,24,0.4) 0%, rgba(15,40,24,0.7) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative; z-index: 2;
            text-align: center; color: white;
            max-width: 900px; padding: 60px;
        }

       .hero-content h1 {
           font-size: 4.5rem; font-weight: 300;
           margin-bottom: 30px;
       }

       .hero-content h1 a.beautifultitlelink,
       .hero-content h1 a.beautifultitlelink:visited,
       .hero-content h1 a.beautifultitlelink:hover,
       .hero-content h1 a.beautifultitlelink:active,
       .hero-content h1 a.beautifultitlelink:focus {
           color: #ffffff !important;
           text-decoration: none !important;
           border-bottom: none !important;
           -webkit-text-fill-color: #ffffff;
       }

        .cta-button {
            display: inline-block;
            padding: 16px 40px; margin: 10px;
            background: var(--warm-gold);
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
            border: 2px solid var(--warm-gold);
            border-radius: 0;
            transition: all 0.3s;
        }

        .cta-button:hover {
            background: transparent;
            color: var(--warm-gold);
        }

        /* Sections */
        section { padding: 100px 60px; max-width: 1400px; margin: 0 auto; }
        h2 { font-size: 3rem; font-weight: 300; color: var(--primary-green); margin-bottom: 20px; }
        .section-subtitle { font-size: 1.2rem; color: #666; margin-bottom: 60px; max-width: 600px; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
        }

        .card {
            background: white;
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }

        .card:hover { transform: translateY(-8px); }

        .card-image {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .card-image-wrapper {
            display: block;
            position: relative;
            overflow: hidden;
        }

        .card-image-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0;
            padding: 24px 28px;
            color: #fff;
            font-size: 2.6rem;
            font-weight: 300;
            line-height: 1.15;
            background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.18) 60%, transparent 100%);
            text-shadow: 0 2px 8px rgba(0,0,0,0.45);
        }

        .card-content { padding: 35px; }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 35px;
        }

        .service-card {
            padding: 40px;
            background: linear-gradient(135deg, var(--cream), white);
            border-left: 4px solid var(--warm-gold);
            border-radius: 0;
        }

        #services {
            position: relative;
            background-color: var(--secondary-green);
            overflow: hidden;
        }

        .services-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .services-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 40, 24, 0.55);
            z-index: 1;
        }

        .services-content {
            position: relative;
            z-index: 2;
        }

        #services h2 {
            color: white;
        }

        #services .section-subtitle {
            color: rgba(255,255,255,0.9);
        }

        #network {
            background: linear-gradient(180deg, #ffffff 0%, var(--cream) 100%);
            border-top: 1px solid rgba(27,67,50,0.08);
            border-bottom: 1px solid rgba(27,67,50,0.08);
        }

        .network-subtitle {
            max-width: 760px;
        }

        .network-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 24px;
        }

        .network-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            padding: 24px;
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(45,106,79,0.12);
            box-shadow: 0 8px 24px rgba(27,67,50,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            text-decoration: none;
            cursor: pointer;
        }

        .network-card:hover {
            transform: translateY(-6px);
            border-color: rgba(212,175,55,0.45);
            box-shadow: 0 16px 32px rgba(27,67,50,0.12);
        }

        .network-card img {
            max-width: 100%;
            max-height: 72px;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: saturate(0.98);
        }

        .contact-section {
            background: #1a472e;
            color: white;
            text-align: center;
            padding: 100px 60px;
            position: relative;
            overflow: hidden;
        }

        .contact-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .contact-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 40, 24, 0.6);
            z-index: 1;
        }

        .contact-section::before {
            content: "";
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: var(--warm-gold);
            opacity: 0.6;
            z-index: 2;
        }

        .contact-section::after {
            content: "";
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: var(--warm-gold);
            opacity: 0.6;
            z-index: 2;
        }

        .contact-section h2 {
            color: white;
            position: relative;
            z-index: 3;
        }

        .contact-section a {
            color: var(--warm-gold);
            text-decoration: none;
            font-weight: 500;
        }

        .contact-section .cta-button {
            position: relative;
            z-index: 3;
            margin: 30px auto 20px;
            display: inline-block;
            color: var(--primary-green);
        }

        .contact-section h5 {
            position: relative;
            z-index: 3;
            margin-top: 40px;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .contact-section p {
            position: relative;
            z-index: 3;
        }

        .ethos-section {
            background: #ffffff;
            padding: 120px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .ethos-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .ethos-header h2 {
            color: #7f96bd;
            font-size: 2.6rem;
            letter-spacing: 0.04em;
            margin-bottom: 18px;
        }

        .ethos-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.7fr) minmax(300px, 0.9fr);
            gap: 80px;
            align-items: start;
        }

        .ethos-col p {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #111;
            margin-bottom: 34px;
            max-width: 100%;
        }

        .ethos-sdg-gallery {
            display: grid;
            gap: 24px;
            margin-top: 36px;
        }

        .ethos-sdg-card {
            background: #ffffff;
            border: 1px solid rgba(127, 150, 189, 0.2);
            box-shadow: 0 10px 30px rgba(27,67,50,0.08);
            padding: 20px;
            display: block;
            text-decoration: none;
        }

        .ethos-sdg-card img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .ethos-sdg-card.logo-card img {
            max-width: 520px;
            margin: 0 auto;
        }

        .ethos-col h3 {
            font-size: 2rem;
            font-weight: 500;
            color: var(--primary-green);
            margin-bottom: 28px;
        }

        .ethos-card {
            margin-bottom: 34px;
        }

        .ethos-card h4 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #111;
            margin-bottom: 14px;
        }

        .ethos-card p {
            margin-bottom: 0;
        }

        .ethos-list {
            display: grid;
            gap: 26px;
        }

        .ethos-note {
            font-size: 1.08rem;
            line-height: 1.65;
            color: #111;
        }

        .network-advantage-section {
            background: linear-gradient(180deg, #ffffff 0%, #f8fbf8 100%);
            border-top: 1px solid rgba(27,67,50,0.08);
            border-bottom: 1px solid rgba(27,67,50,0.08);
            padding: 110px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .network-advantage-section .content {
            max-width: 1000px;
            margin: 0 auto;
        }

        .network-advantage-section h2 {
            color: var(--primary-green);
            font-size: 2.6rem;
            margin-bottom: 24px;
        }

        .network-advantage-section p {
            font-size: 1.08rem;
            line-height: 1.8;
            color: #222;
            margin-bottom: 22px;
        }

        .network-advantage-section .highlight {
            font-weight: 700;
            color: var(--primary-green);
        }

        .network-briefing-link {
            display: inline-block;
            margin-top: 26px;
            padding: 16px 28px;
            background: var(--primary-green);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid var(--primary-green);
            transition: all 0.3s ease;
        }

        .network-briefing-link:hover {
            background: transparent;
            color: var(--primary-green);
        }

        /* Footer */
        footer {
            background: var(--primary-green);
            color: white;
            padding: 40px 60px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        footer p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .footer-legal {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .footer-legal a {
            color: var(--warm-gold);
            text-decoration: none;
            font-size: 0.85rem;
            transition: opacity 0.3s ease;
        }

        .footer-legal a:hover {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .hero-content h1 { font-size: 2.8rem; }
            section { padding: 80px 20px; }
            footer { padding: 30px 20px; }
            .network-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .network-card { min-height: 120px; padding: 20px; }
            .network-card img { max-height: 56px; }
            .two-col-mobile {
                display: grid !important;
                grid-template-columns: 1fr !important;
                gap: 32px !important;
                align-items: start !important;
                width: 100% !important;
                max-width: 100% !important;
                padding-left: 20px !important;
                padding-right: 20px !important;
                margin: 0 auto !important;
                overflow-x: hidden !important;
            }
            .two-col-mobile > div {
                width: 100% !important;
                min-width: 0 !important;
                max-width: 100% !important;
            }
            .two-col-mobile h2 {
                font-size: 2.2rem !important;
                margin-bottom: 18px !important;
                text-align: left !important;
                word-break: break-word;
            }
            .two-col-mobile h3 {
                font-size: 1.2rem !important;
                line-height: 1.35 !important;
                word-break: break-word;
            }
            .two-col-mobile p {
                font-size: 1rem !important;
                line-height: 1.75 !important;
                word-break: break-word;
            }
            .mobile-center-text {
                text-align: center !important;
                margin-left: auto !important;
                margin-right: auto !important;
            }
            .ethos-section, .network-advantage-section {
                padding: 80px 20px;
            }
            .ethos-header h2 {
                font-size: 2rem;
            }
            .ethos-layout {
                grid-template-columns: 1fr;
                gap: 40px;
            }
            .ethos-col p {
                font-size: 1rem;
            }
            .ethos-sdg-gallery {
                gap: 16px;
            }
        }
    </style>
</head>
